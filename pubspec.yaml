name: hirenest
description: A modern global job search and marketplace platform — HireNest
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Core UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.3.2
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  cached_network_image: ^3.3.0

  flutter_rating_bar: ^4.0.1
  collection: ^1.19.1
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^17.0.1

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1
  flutter_web_auth_2: ^4.1.0
  app_links: ^7.0.0

  # Local Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_messaging: ^16.0.4
  firebase_analytics: ^12.0.4

  # Realtime / Chat
  socket_io_client: ^3.1.3

  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Image & Media
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  flutter_image_compress: ^2.1.0
  video_player: ^2.8.1

  # File Handling
  file_picker: ^10.3.7
  path_provider: ^2.1.1
  open_file: ^3.3.2
  flutter_pdfview: ^1.3.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.2
  url_launcher: ^6.2.2
  share_plus: ^12.0.1
  flutter_dotenv: ^6.0.0
  logger: ^2.0.2+1
  connectivity_plus: ^7.0.0
  package_info_plus: ^8.3.1
  device_info_plus: ^12.3.0

  # Permissions & Location
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # UI Helpers
  fluttertoast: ^9.0.0
  another_flushbar: ^1.12.30
  flutter_spinkit: ^5.2.0
  pull_to_refresh: ^2.0.0

  # Analytics / Charts
  fl_chart: ^1.1.1

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  timeago: ^3.7.1

  # Notification
  flutter_local_notifications: ^19.5.0

  # Security
  crypto: ^3.0.7
  local_auth: ^3.0.0

  # Social Connectors
  google_sign_in: ^7.2.0
  font_awesome_flutter: ^10.12.0

  # JSON Serialization - CRITICAL: Must be in dependencies, not dev_dependencies
  json_annotation: ^4.9.0



  http: any
  google_nav_bar: ^5.0.7
  sentry_flutter: ^8.14.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # Code Generation
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#2563EB"

  # NOTE: Don't add analyzer here - it causes version conflicts
  # Let the code generators manage their own analyzer dependencies

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/

  #fonts:
   # - family: CustomIcons
     # fonts:
      #  - asset: assets/fonts/CustomIcons.ttf